[package]
name = "canary-agent"
version = "0.1.0"
edition = "2024"
description = "Canary's log agent: follows log files, parses their lines and ships them to the collector"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[dev-dependencies]
tempfile = "3"
